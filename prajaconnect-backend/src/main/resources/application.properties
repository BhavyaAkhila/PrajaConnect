spring.application.name=prajaconnect

# Database Configuration
# Prefer DATABASE_* env vars; fall back to SPRING_DATASOURCE_* for hosting platforms that provide them
spring.datasource.url=${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prajaconnect_db}}
spring.datasource.username=${DATABASE_USERNAME:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}

# Frontend origins allowed to call the API
# Provide a comma-separated list or rely on CORS_ALLOWED_ORIGIN_PATTERNS env var
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://localhost:4173,http://localhost:5173}

# JWT Configuration
# Use JWT_SECRET environment variable in production. Default is a placeholder that MUST be changed.
prajaconnect.app.jwtSecret=${JWT_SECRET:change_this_jwt_secret}
# JWT expiration in milliseconds (default: 1 day)
prajaconnect.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# File Upload Configuration
file.upload-dir=uploads
