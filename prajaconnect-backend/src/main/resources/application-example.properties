# Example application properties - safe placeholders only
spring.application.name=prajaconnect

# Database (example)
# Use: DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
DATABASE_URL=jdbc:mysql://localhost:3306/prajaconnect_db
DATABASE_USERNAME=your_database_username
DATABASE_PASSWORD=your_database_password

# JTW configuration
JWT_SECRET=your_jwt_secret
JWT_EXPIRATION=86400000

# CORS
CORS_ALLOWED_ORIGIN_PATTERNS=http://localhost:3000,http://localhost:4173,http://localhost:5173

# Server port (optional)
PORT=8080

# File upload directory (relative to application root)
file.upload-dir=uploads
